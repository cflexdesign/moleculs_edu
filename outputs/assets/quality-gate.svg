<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-label="Пять причин вернуть материал на доработку"><rect width="1200" height="410" rx="24" fill="#fff"/><text x="34" y="53" fill="#191525" font-family="Arial,sans-serif" font-size="29" font-weight="700">Пять причин вернуть материал на доработку</text><text x="34" y="86" fill="#716779" font-family="Arial,sans-serif" font-size="16">Красивый результат становится рабочим только после проверки владельцем задачи.</text><rect x="34.0" y="125" width="212.0" height="223" rx="17" fill="#eee7ff"/><text x="53.0" y="160" font-family="Arial,sans-serif" font-size="14" fill="#7143d7" font-weight="700">01</text><text x="53.0" y="199" font-family="Arial,sans-serif" font-size="20" fill="#191525" font-weight="700">Факт</text><text x="53.0" y="263" font-family="Arial,sans-serif" font-size="15" fill="#5b5464">Цена или срок</text><text x="53.0" y="288" font-family="Arial,sans-serif" font-size="15" fill="#5b5464">не подтверждены</text><rect x="264.0" y="125" width="212.0" height="223" rx="17" fill="#dcfaee"/><text x="283.0" y="160" font-family="Arial,sans-serif" font-size="14" fill="#7143d7" font-weight="700">02</text><text x="283.0" y="199" font-family="Arial,sans-serif" font-size="20" fill="#191525" font-weight="700">Смысл</text><text x="283.0" y="263" font-family="Arial,sans-serif" font-size="15" fill="#5b5464">Обещание сильнее</text><text x="283.0" y="288" font-family="Arial,sans-serif" font-size="15" fill="#5b5464">реальных возможностей</text><rect x="494.0" y="125" width="212.0" height="223" rx="17" fill="#fff1e7"/><text x="513.0" y="160" font-family="Arial,sans-serif" font-size="14" fill="#7143d7" font-weight="700">03</text><text x="513.0" y="199" font-family="Arial,sans-serif" font-size="20" fill="#191525" font-weight="700">Визуал</text><text x="513.0" y="263" font-family="Arial,sans-serif" font-size="15" fill="#5b5464">Товар или лицо</text><text x="513.0" y="288" font-family="Arial,sans-serif" font-size="15" fill="#5b5464">заметно изменились</text><rect x="724.0" y="125" width="212.0" height="223" rx="17" fill="#e5f4ff"/><text x="743.0" y="160" font-family="Arial,sans-serif" font-size="14" fill="#7143d7" font-weight="700">04</text><text x="743.0" y="199" font-family="Arial,sans-serif" font-size="20" fill="#191525" font-weight="700">Техника</text><text x="743.0" y="263" font-family="Arial,sans-serif" font-size="15" fill="#5b5464">Текст не читается</text><text x="743.0" y="288" font-family="Arial,sans-serif" font-size="15" fill="#5b5464">Звук или стык мешает</text><rect x="954.0" y="125" width="212.0" height="223" rx="17" fill="#f2eaff"/><text x="973.0" y="160" font-family="Arial,sans-serif" font-size="14" fill="#7143d7" font-weight="700">05</text><text x="973.0" y="199" font-family="Arial,sans-serif" font-size="20" fill="#191525" font-weight="700">Действие</text><text x="973.0" y="263" font-family="Arial,sans-serif" font-size="15" fill="#5b5464">Непонятно, куда</text><text x="973.0" y="288" font-family="Arial,sans-serif" font-size="15" fill="#5b5464">обратиться клиенту</text><text x="34" y="383" font-family="Arial,sans-serif" font-size="13" fill="#716779">МОЛЕКУЛА · Учебная схема. Это методика работы, а не скриншот сервиса.</text></svg>