<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-label="Что нужно закрепить в изображении"><rect width="1200" height="410" rx="24" fill="#fff"/><text x="34" y="53" fill="#191525" font-family="Arial,sans-serif" font-size="29" font-weight="700">Что нужно закрепить в изображении</text><text x="34" y="86" fill="#716779" font-family="Arial,sans-serif" font-size="16">Назначьте каждому референсу одну понятную роль. После правки проверяйте сохранённые элементы.</text><rect x="34.0" y="125" width="212.0" height="223" rx="17" fill="#eee7ff"/><text x="53.0" y="160" font-family="Arial,sans-serif" font-size="14" fill="#7143d7" font-weight="700">01</text><text x="53.0" y="199" font-family="Arial,sans-serif" font-size="20" fill="#191525" font-weight="700">Объект</text><text x="53.0" y="263" font-family="Arial,sans-serif" font-size="15" fill="#5b5464">Форма и пропорции</text><text x="53.0" y="288" font-family="Arial,sans-serif" font-size="15" fill="#5b5464">Цвет и комплектация</text><rect x="264.0" y="125" width="212.0" height="223" rx="17" fill="#dcfaee"/><text x="283.0" y="160" font-family="Arial,sans-serif" font-size="14" fill="#7143d7" font-weight="700">02</text><text x="283.0" y="199" font-family="Arial,sans-serif" font-size="20" fill="#191525" font-weight="700">Композиция</text><text x="283.0" y="263" font-family="Arial,sans-serif" font-size="15" fill="#5b5464">Ракурс и масштаб</text><text x="283.0" y="288" font-family="Arial,sans-serif" font-size="15" fill="#5b5464">Место под надпись</text><rect x="494.0" y="125" width="212.0" height="223" rx="17" fill="#fff1e7"/><text x="513.0" y="160" font-family="Arial,sans-serif" font-size="14" fill="#7143d7" font-weight="700">03</text><text x="513.0" y="199" font-family="Arial,sans-serif" font-size="20" fill="#191525" font-weight="700">Освещение</text><text x="513.0" y="263" font-family="Arial,sans-serif" font-size="15" fill="#5b5464">Направление света</text><text x="513.0" y="288" font-family="Arial,sans-serif" font-size="15" fill="#5b5464">Тени и отражения</text><rect x="724.0" y="125" width="212.0" height="223" rx="17" fill="#e5f4ff"/><text x="743.0" y="160" font-family="Arial,sans-serif" font-size="14" fill="#7143d7" font-weight="700">04</text><text x="743.0" y="199" font-family="Arial,sans-serif" font-size="20" fill="#191525" font-weight="700">Стиль</text><text x="743.0" y="263" font-family="Arial,sans-serif" font-size="15" fill="#5b5464">Палитра и материал</text><text x="743.0" y="288" font-family="Arial,sans-serif" font-size="15" fill="#5b5464">Общий характер серии</text><rect x="954.0" y="125" width="212.0" height="223" rx="17" fill="#f2eaff"/><text x="973.0" y="160" font-family="Arial,sans-serif" font-size="14" fill="#7143d7" font-weight="700">05</text><text x="973.0" y="199" font-family="Arial,sans-serif" font-size="20" fill="#191525" font-weight="700">Проверка</text><text x="973.0" y="263" font-family="Arial,sans-serif" font-size="15" fill="#5b5464">Буквы и логотип</text><text x="973.0" y="288" font-family="Arial,sans-serif" font-size="15" fill="#5b5464">Соответствие исходнику</text><text x="34" y="383" font-family="Arial,sans-serif" font-size="13" fill="#716779">МОЛЕКУЛА · Учебная схема. Это методика работы, а не скриншот сервиса.</text></svg>